<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侧边栏 · 变体B 彩色主题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; min-height: 100vh; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #202124; }
  .side { width: 240px; background: #fff; padding: 18px 12px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid #EEEEEA; flex-shrink: 0; }
  .brand { font-size: 16px; font-weight: 800; padding: 2px 10px 12px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 3px; background: #2F6B57; }
  .g { font-size: 11px; color: #9B9B93; padding: 12px 10px 5px; font-weight: 600; }
  .item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; font-size: 13.5px; color: #555; cursor: pointer; }
  .item:hover { background: #F7F7F5; }
  .item.on { background: #F0F5F2; color: #2F6B57; font-weight: 700; }
  .item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .side .spacer { flex: 1; }
  .main { flex: 1; background: #F7F7F5; padding: 30px; }
  .ph { background: #fff; border: 1px dashed #DDD; border-radius: 12px; height: 100%; display: flex; align-items: center; justify-content: center; color: #BBB; font-size: 13px; }
</style>
</head>
<body>
  <div class="side">
    <div class="brand"><span class="dot"></span>个人工作台</div>
    <div class="g">开始</div>
    <div class="item on"><span class="dot" style="background:#34495E;"></span>今日</div>
    <div class="g">我的领域</div>
    <div class="item"><span class="dot" style="background:#F5B041;"></span>考研备考</div>
    <div class="item"><span class="dot" style="background:#2980B9;"></span>英语学习</div>
    <div class="item"><span class="dot" style="background:#3498DB;"></span>AI 知识学习</div>
    <div class="item"><span class="dot" style="background:#8E44AD;"></span>学业课程</div>
    <div class="g">工具</div>
    <div class="item"><span class="dot" style="background:#E74C3C;"></span>专注</div>
    <div class="item"><span class="dot" style="background:#27AE60;"></span>学习记录</div>
    <div class="item"><span class="dot" style="background:#2980B9;"></span>资料库</div>
    <div class="item"><span class="dot" style="background:#9B59B6;"></span>收集箱</div>
    <div class="item"><span class="dot" style="background:#F39C12;"></span>错题本</div>
    <div class="item"><span class="dot" style="background:#1ABC9C;"></span>答疑库</div>
    <div class="item"><span class="dot" style="background:#34495E;"></span>复盘</div>
    <div class="item"><span class="dot" style="background:#2ECC71;"></span>健康</div>
    <div class="item"><span class="dot" style="background:#8E44AD;"></span>日历</div>
    <div class="item"><span class="dot" style="background:#3498DB;"></span>AI 帮手</div>
    <div class="spacer"></div>
    <div class="g">系统</div>
    <div class="item"><span class="dot" style="background:#34495E;"></span>搜索</div>
    <div class="item"><span class="dot" style="background:#7F8C8D;"></span>设置与数据</div>
  </div>
  <div class="main"><div class="ph">内容区（当前页面）</div></div>
</body>
</html>
