<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专注页 · 变体A 沉浸大圆环</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F7F7F5; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #202124; padding: 24px; max-width: 900px; margin: 0 auto; }
  /* 类型胶囊 */
  .types { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; justify-content: center; }
  .tp { border: 1px solid #E6E7E4; border-radius: 999px; padding: 7px 16px; font-size: 13px; color: #555; cursor: pointer; background: #fff; transition: all .15s; }
  .tp.on { background: #2F6B57; border-color: #2F6B57; color: #fff; font-weight: 600; }
  /* 圆环区 */
  .ring-wrap { text-align: center; margin-bottom: 18px; }
  .ring { width: 260px; height: 260px; border-radius: 50%; margin: 0 auto; position: relative; background: conic-gradient(#2F6B57 0% 0%, #EDEFEC 0% 100%); display: flex; align-items: center; justify-content: center; }
  .ring-inner { width: 226px; height: 226px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-time { font-size: 52px; font-weight: 900; letter-spacing: 1px; }
  .ring-label { font-size: 13px; color: #6F7277; margin-top: 6px; }
  /* 命名输入 */
  .name-input { display: flex; gap: 8px; max-width: 420px; margin: 0 auto 16px; }
  .name-input input { flex: 1; border: 1px solid #E6E7E4; border-radius: 10px; padding: 10px 14px; font-size: 14px; background: #fff; outline: none; }
  .name-input input:focus { border-color: #2F6B57; }
  .start-btn { border: none; border-radius: 10px; padding: 10px 28px; font-size: 14px; font-weight: 700; background: #2F6B57; color: #fff; cursor: pointer; }
  /* 白噪音条 */
  .sound { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 22px; flex-wrap: wrap; }
  .sd { border: 1px solid #E6E7E4; background: #fff; border-radius: 10px; padding: 6px 12px; font-size: 12px; color: #555; cursor: pointer; }
  .sd.on { background: #FCF5E5; border-color: #F3E3B8; color: #B07D0E; }
  /* 统计+历史 */
  .stats { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; }
  .st { flex: 1; max-width: 150px; background: #fff; border: 1px solid #E8E8E5; border-radius: 12px; padding: 12px; text-align: center; }
  .st-num { font-size: 20px; font-weight: 800; color: #2F6B57; }
  .st-label { font-size: 11.5px; color: #6F7277; margin-top: 2px; }
  .history { background: #fff; border: 1px solid #E8E8E5; border-radius: 12px; padding: 6px 16px; }
  .his-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F2F2EF; font-size: 13px; }
  .his-item:last-child { border: none; }
  .his-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .his-name { flex: 1; }
  .his-type { font-size: 11px; color: #6F7277; }
  .his-time { color: #6F7277; font-size: 12px; }
</style>
</head>
<body>
  <div class="types">
    <span class="tp on">🍅 番茄钟</span><span class="tp">🧠 深度工作</span><span class="tp">⏱ 限时冲刺</span><span class="tp">🌧 白噪音</span><span class="tp">🧘 冥想</span><span class="tp">📋 任务绑定</span><span class="tp">🎯 自定义</span>
  </div>

  <div class="ring-wrap">
    <div class="ring">
      <div class="ring-inner">
        <div class="ring-time">25:00</div>
        <div class="ring-label">番茄钟 · 待开始</div>
      </div>
    </div>
  </div>

  <div class="name-input">
    <input placeholder="这 1 小时在干嘛？如：英语阅读精读 / 数学真题">
    <button class="start-btn">开始专注</button>
  </div>

  <div class="sound">
    <span class="sd">🌧 雨声</span><span class="sd">☕ 咖啡馆</span><span class="sd">🌲 森林</span><span class="sd">🌊 海浪</span><span class="sd">🔇 静音</span>
  </div>

  <div class="stats">
    <div class="st"><div class="st-num">2</div><div class="st-label">今日专注（次）</div></div>
    <div class="st"><div class="st-num">85 分</div><div class="st-label">今日时长</div></div>
    <div class="st"><div class="st-num">4 天</div><div class="st-label">连续专注</div></div>
    <div class="st"><div class="st-num">64 分</div><div class="st-label">最长一次</div></div>
  </div>

  <div class="history">
    <div class="his-item"><span class="his-dot" style="background:#2F6B57;"></span><span class="his-name">英语阅读精读 Text1</span><span class="his-type">深度工作</span><span class="his-time">60 分 · 今天 09:20</span></div>
    <div class="his-item"><span class="his-dot" style="background:#E74C3C;"></span><span class="his-name">高数第 3 章习题</span><span class="his-type">番茄钟</span><span class="his-time">25 分 · 今天 08:30</span></div>
    <div class="his-item"><span class="his-dot" style="background:#3498DB;"></span><span class="his-name">考研英语单词复习</span><span class="his-type">任务绑定</span><span class="his-time">25 分 · 昨天</span></div>
  </div>
</body>
</html>
