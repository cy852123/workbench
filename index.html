<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2F6B57">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%232F6B57'/><path d='M12 5v14M5 12h14' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<title>个人工作台</title>
<link rel="stylesheet" href="styles.css?v=v066">
</head>
<body>

<!-- 桌面侧边栏 -->
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg>
    <span class="brand-text">个人工作台</span>
  </div>
  <nav class="side-nav" id="sideNav"></nav>
  <div class="side-foot">
    <div class="side-save" id="sideSave">数据保存在本机浏览器</div>
    <div class="side-ver" id="sideVer">v0.1.0</div>
  </div>
</aside>

<!-- 主区域 -->
<main class="main" id="main">
  <header class="topbar" id="topbar"></header>
  <section class="view-wrap" id="viewWrap"></section>
</main>

<!-- 手机底部导航 -->
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- 手机更多抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="drawer-title">全部功能</span>
    <button class="icon-btn" id="drawerClose" title="关闭">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- 模态层 -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn" id="modalClose" title="关闭">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- 帮助弹层 -->
<div class="help-mask" id="helpMask">
  <div class="help-box" id="helpBox"></div>
</div>

<!-- 提示条 -->
<div class="toast" id="toast"></div>

<script src="views.js?v=v066"></script>
<script src="app.js?v=v066"></script>
<script>
/* 注册 Service Worker（PWA：离线可用 + 安装到手机桌面） */
if ("serviceWorker" in navigator) {
  var swReg = null, swReloading = false;
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("service-worker.js").then(function (r) {
      swReg = r;
      /* 2026-09-17：浏览器只在「导航」时才会去查 SW 有没有更新 —— 手机 PWA 切后台
         再切回来没有导航，于是就永远挂着旧版（用户反馈「手机端没有更新」）。
         这里注册完主动查一次。 */
      r.update().catch(function () {});
    }).catch(function (e) {
      console.warn("Service Worker 注册失败（不影响正常使用）", e);
    });
  });
  /* 每次回到前台都查一次更新（被挂起的情况靠这个救回来） */
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && swReg) swReg.update().catch(function () {});
  });
  /* 新 SW 接管后刷新一次，保证看到的是新版；加锁避免反复刷新 */
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (swReloading) return;
    swReloading = true;
    window.location.reload();
  });
}
/* 侧边栏版本号 = 本机实际在用的缓存号（Cache Storage 里那个 wb-cache-vNNN）。
   2026-09-17 加：之前写死 "v0.1.0"，手机端到底跑的是哪版只能靠猜，
   排查「部署了但没更新」时完全没有依据。 */
if (window.caches && caches.keys) {
  caches.keys().then(function (ks) {
    var mine = ks.filter(function (k) { return k.indexOf("wb-cache-") === 0; }).sort();
    var k = mine[mine.length - 1];
    var el = document.getElementById("sideVer");
    if (k && el) el.textContent = k.replace("wb-cache-", "") + (mine.length > 1 ? "（有 " + mine.length + " 份缓存）" : "");
  }).catch(function () {});
}
</script>
</body>
</html>
